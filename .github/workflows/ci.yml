name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Build (Debug)
        run: xcodebuild -project TQwallpaper.xcodeproj -scheme TQwallpaper -configuration Debug -derivedDataPath DerivedData build

      - name: Run unit tests
        run: xcodebuild -project TQwallpaper.xcodeproj -scheme TQwallpaper -configuration Debug -derivedDataPath DerivedData test

      - name: Build (Release)
        run: xcodebuild -project TQwallpaper.xcodeproj -scheme TQwallpaper -configuration Release -derivedDataPath DerivedData build

      - name: Upload Release app artifact
        uses: actions/upload-artifact@v4
        with:
          name: TQwallpaper-Release
          path: DerivedData/Build/Products/Release/TQwallpaper.app
